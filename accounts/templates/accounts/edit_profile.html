{% extends 'base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet"
href="{% static 'css/accounts/edit_profile.css' %}">
{% endblock %}

{% block content %}

<div class="edit-profile-wrapper">

    <div class="edit-profile-card">

        <div class="profile-top">

            <div class="profile-avatar-wrapper">

                {% if profile.profile_pic %}

                    <img
                        src="{{ profile.profile_pic.url }}"
                        class="profile-avatar-img"
                        alt="Profile">

                {% else %}

                    <div class="profile-avatar">

                        {{ user.username|first|upper }}

                    </div>

                {% endif %}

            </div>

            <h2>Edit Profile</h2>

            <p>
                Update your personal information
            </p>

        </div>

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6">

                    <label>Username</label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           value="{{ user.username }}"
                           required>

                </div>

                <div class="col-md-6">

                    <label>Email</label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ user.email }}"
                           required>

                </div>

            </div>

            <div class="mt-3">

                <label>Phone Number</label>

                <input type="text"
                       name="phone"
                       class="form-control"
                       value="{{ profile.phone }}">

            </div>

            <div class="mt-3">

                <label>City</label>

                <input type="text"
                       name="city"
                       class="form-control"
                       value="{{ profile.city }}">

            </div>

            <div class="mt-3">

                <label>Address</label>

                <textarea
                    name="address"
                    rows="3"
                    class="form-control">{{ profile.address }}</textarea>

            </div>

            <div class="mt-3">

                <label>Bio</label>

                <textarea
                    name="bio"
                    rows="4"
                    class="form-control">{{ profile.bio }}</textarea>

            </div>

            <div class="mb-4">

                <label>Profile Picture</label>

                <input type="file"
                       name="profile_pic"
                       class="form-control">

            </div>

            <button
                class="save-btn mt-4">

                🚀 Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
