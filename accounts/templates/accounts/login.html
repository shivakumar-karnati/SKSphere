{% extends 'base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet"
href="{% static 'css/accounts/loginpage.css' %}">
{% endblock %}

{% block content %}
<div class="login-page">

    <div class="login-card">

        <div class="login-logo">

            <img src="{% static 'images/SKSphere_logo.png' %}" alt="">

            <h2>SKSphere</h2>

            <p>Welcome Back</p>

        </div>
        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}
        <form method="POST">

            {% csrf_token %}

            <div class="input-box">

                <i class="fas fa-user"></i>

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>

            </div>

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

            </div>

            <button type="submit" class="login-btn">

                Login

            </button>

        </form>

        <div class="extra-links">

            <p>
                Don't have an account?
                <a href="{% url 'register' %}">
                    Register
                </a>
            </p>
            <p class="mt-2">

                <a href="{% url 'forgot_password' %}">
                    Forgot Password?
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
